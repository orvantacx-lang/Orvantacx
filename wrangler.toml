# Cloudflare Pages configuration for ORVANTA CX.
# Because this file sets pages_build_output_dir, it is the source of truth for bindings
# (the D1 binding below is NOT edited in the dashboard). See docs/DEPLOYMENT.md.
name = "orvanta-cx"
compatibility_date = "2026-11-01"
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "orvanta-cx-enquiries"
# Replace with the ID printed by:  npx wrangler d1 create orvanta-cx-enquiries
# (A placeholder is fine for local testing with --local.)
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
